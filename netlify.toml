# Configuration Netlify pour Nuxt 3 SSR + API Routes
[build]
  # Commande de build avec nettoyage du cache
  command = "rm -rf .nuxt .output node_modules/.vite node_modules/.cache && npm install && npm run build"
  publish = "dist"                  # ← changez cette ligne
  functions = ".netlify/functions"  # optionnel, Netlify le fait déjà
  
  # Répertoire de sortie (Nuxt 3 génère .output)
  #publish = ".output/public"
  
  # Ignorer le cache Netlify (forcer un build propre)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF"
  
  # Variables d'environnement de build
  [build.environment]
    NODE_VERSION = "22"
    NITRO_PRESET = "netlify"    # CETTE LIGNE EST OBLIGATOIRE !
    NPM_FLAGS = "--legacy-peer-deps"
    # Désactiver le cache de build de Nuxt
    NUXT_TELEMETRY_DISABLED = "1"

# Configuration des fonctions (pour les routes /api)
[functions]
  # Timeout pour les fonctions serverless (max 10s sur Netlify gratuit)
  node_bundler = "esbuild"
  included_files = [".output/**"]

# Redirections et rewrites pour SSR
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
  
# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Configuration des assets statiques
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
